<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kvarnens café – bilder (tung version)</title>
    <style>
      body { font-family: Georgia, serif; max-width: 40rem; margin: 0 auto; padding: 1rem; line-height: 1.6; }
      img { width: 100%; max-width: 400px; display: block; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <h1>Kvarnens café</h1>
    <p>Den här sidan är medvetet tung. Bilderna visas högst 400 pixlar breda men är mycket större än så.</p>

    <img src="kvarnen.jpg" alt="Kvarnen med sina vingar en solig dag">
    <p>Kvarnen byggdes 1887 och blev kafé hundra år senare.</p>

    <img src="kaffe.jpg" alt="En kopp kaffe uppifrån">
    <p>Vi rostar våra bönor själva varje vecka.</p>

    <img src="solnedgang.jpg" alt="Solnedgång över åkrarna bakom kaféet">
    <p>Sommarkvällar har vi öppet till solnedgången.</p>
  </body>
</html>
